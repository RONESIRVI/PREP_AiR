name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📱 Install Android SDK 36
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: 📦 Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: 🏗️ Build Web Application (Vite)
        run: |
          npm run build

      - name: ⚡ Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔨 Grant Execute Permission to Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew

      - name: 🚀 Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🔍 Locate Built APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPSC-Conquest-Android-App-Debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

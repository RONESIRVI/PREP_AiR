# ══════════════════════════════════════════════════════════════════════════
#  Sadhna — Release Workflow
#  Trigger: git tag v* (e.g. git tag v1.2.0 && git push origin v1.2.0)
#
#  Steps:
#   1. Checkout code
#   2. Setup JDK 17 + Cache Gradle
#   3. Decode keystore from GitHub Secret
#   4. Build signed Release APK + AAB
#   5. Create GitHub Release + upload APK  ← OTA users download this
#   6. (Optional) Upload AAB to Play Console
# ══════════════════════════════════════════════════════════════════════════

name: 🚀 Release — Build & Publish APK

on:
  push:
    tags:
      - 'v*'          # Triggers on v1.0.0, v1.2.3, v2.0.0-beta, etc.

# Cancel any in-progress release run for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a release mid-flight

jobs:

  # ──────────────────────────────────────────────────────────────────────
  #  JOB 1: Build signed APK + AAB
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      apk_path: ${{ steps.paths.outputs.apk }}
      aab_path: ${{ steps.paths.outputs.aab }}
      version:  ${{ steps.version.outputs.name }}

    steps:

      # 1. Checkout full history (needed for changelog generation)
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git log changelog

      # 2. Parse version from tag  (v1.2.0 → 1.2.0)
      - name: 🏷️ Parse Version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"          # strip leading "v"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "::notice::Building Sadhna $VERSION"

      # 3. Setup JDK 17
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 4. Setup Android SDK (already on ubuntu-latest, just set ANDROID_HOME)
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Cache Gradle — speeds up builds significantly
      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 6. Grant execute permission to gradlew
      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      # 7. Decode keystore from base64 secret → write to disk
      - name: 🔐 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > sadhna_release.jks
          echo "Keystore decoded ✓"

      # 8. Inject signing credentials into local.properties
      - name: ⚙️ Configure Signing
        run: |
          cat >> local.properties << EOF
          KEYSTORE_FILE=../sadhna_release.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      # 9. Run unit tests before building release
      - name: 🧪 Run Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon
        continue-on-error: false   # Fail fast if tests break

      # 10. Build signed release APK  (→ OTA download for users)
      - name: 🏗️ Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace

      # 11. Build signed AAB  (→ Play Store upload)
      - name: 🏗️ Build Release AAB
        run: |
          ./gradlew bundleRelease \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon

      # 12. Rename output files with version number
      - name: 📝 Rename Outputs
        id: paths
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          APK_DST="sadhna-v${VERSION}.apk"
          AAB_DST="sadhna-v${VERSION}.aab"

          mv "$APK_SRC" "$APK_DST"
          mv "$AAB_SRC" "$AAB_DST"

          echo "apk=$APK_DST" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_DST" >> "$GITHUB_OUTPUT"

          # Print file sizes
          echo "APK size: $(du -sh $APK_DST | cut -f1)"
          echo "AAB size: $(du -sh $AAB_DST | cut -f1)"

      # 13. Upload APK as workflow artifact (for debugging)
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadhna-release-apk
          path: ${{ steps.paths.outputs.apk }}
          retention-days: 30

      # 14. Upload AAB as workflow artifact
      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadhna-release-aab
          path: ${{ steps.paths.outputs.aab }}
          retention-days: 30

      # 15. Clean up keystore from disk
      - name: 🧹 Cleanup Keystore
        if: always()
        run: rm -f sadhna_release.jks

  # ──────────────────────────────────────────────────────────────────────
  #  JOB 2: Create GitHub Release + upload APK (OTA trigger)
  # ──────────────────────────────────────────────────────────────────────
  release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # needed to create release + upload assets

    steps:

      - name: 📥 Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download APK from previous job
      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: sadhna-release-apk

      # Download AAB from previous job
      - name: 📥 Download AAB
        uses: actions/download-artifact@v4
        with:
          name: sadhna-release-aab

      # Generate changelog from git log since last tag
      - name: 📋 Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" | head -20)
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s")
          fi

          # Write to file (handles multiline)
          {
            echo "text<<EOF"
            echo "## 🔥 What's new in ${{ github.ref_name }}"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo "_Sadhna (साधना) — Study Focus & Phone Discipline_"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Create the GitHub Release + upload APK as asset
      # This is what UpdateChecker.kt polls via the GitHub API!
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🔥 Sadhna ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.text }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            sadhna-v${{ needs.build.outputs.version }}.apk
            sadhna-v${{ needs.build.outputs.version }}.aab
          token: ${{ secrets.GITHUB_TOKEN }}

      # Notify success
      - name: ✅ Release Summary
        run: |
          echo "### 🚀 Release Published!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | \`sadhna-v${{ needs.build.outputs.version }}.apk\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OTA | All Sadhna users will see update dialog 🔔 |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  #  JOB 3: (Optional) Upload AAB to Google Play Console
  # ──────────────────────────────────────────────────────────────────────
  play-store:
    name: 🏪 Upload to Play Store (optional)
    runs-on: ubuntu-latest
    needs: [build, release]
    if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
    # Only upload stable releases to Play Store

    steps:

      - name: 📥 Download AAB
        uses: actions/download-artifact@v4
        with:
          name: sadhna-release-aab

      - name: 🏪 Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: in.sadhna.focus
          releaseFiles: sadhna-v${{ needs.build.outputs.version }}.aab
          track: internal          # internal → alpha → beta → production
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-IN/changelogs/

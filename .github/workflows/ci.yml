# ══════════════════════════════════════════════════════════════════════════
#  Sadhna — Continuous Integration Workflow
#
#  Triggers:
#   • Every push to main / develop branch
#   • Every Pull Request targeting main
#
#  Jobs:
#   1. lint      — Android Lint + Kotlin style
#   2. test      — Unit tests + coverage report
#   3. build     — Debug APK (sanity check)
#   4. security  — Dependency vulnerability scan
# ══════════════════════════════════════════════════════════════════════════

name: 🔍 CI — Lint · Test · Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - 'fastlane/**'

  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel previous CI run if a new commit is pushed to same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g'

jobs:

  # ──────────────────────────────────────────────────────────────────────
  #  JOB 1 — LINT
  #  Runs Android Lint and reports issues as PR annotations
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🧹 Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: 📊 Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      # Post lint results as PR comment
      - name: 💬 Lint PR Comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Android Lint failed** — please fix lint errors before merging.\n\nDownload the full report from the workflow artifacts.'
            })

  # ──────────────────────────────────────────────────────────────────────
  #  JOB 2 — UNIT TESTS + COVERAGE
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint     # Only run tests if lint passes

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🧪 Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --continue

      - name: 📊 Generate Coverage Report (JaCoCo)
        run: ./gradlew jacocoTestReport --no-daemon
        continue-on-error: true

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
          retention-days: 7

      # Parse test results and post summary
      - name: 📋 Test Summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: app/build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

  # ──────────────────────────────────────────────────────────────────────
  #  JOB 3 — BUILD DEBUG APK
  #  Confirms the project compiles successfully on every push
  # ──────────────────────────────────────────────────────────────────────
  build-debug:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🏗️ Assemble Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --build-cache

      - name: 📏 APK Size Check
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE_MB=$(du -m "$APK" | cut -f1)
          echo "Debug APK size: ${SIZE_MB} MB"

          # Fail if APK > 50 MB (sanity check)
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "❌ APK too large: ${SIZE_MB} MB (max 50 MB)"
            exit 1
          fi
          echo "✅ APK size OK: ${SIZE_MB} MB"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sadhna-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      # Write CI summary
      - name: 📋 CI Summary
        if: always()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -sh "$APK" 2>/dev/null | cut -f1 || echo "N/A")
          {
            echo "## 🔨 CI Build Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Lint  | ✅ Passed |"
            echo "| Tests | ✅ Passed |"
            echo "| Build | ✅ Passed |"
            echo "| APK   | $SIZE |"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Branch: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  #  JOB 4 — DEPENDENCY SECURITY SCAN
  #  Checks for known CVEs in Gradle dependencies
  # ──────────────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🔒 Dependency Vulnerability Scan (OWASP)
        run: |
          ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true   # Don't block CI for informational scan

      - name: 📤 Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: build/reports/dependency-check-report.html
          retention-days: 14

name: 🐛 Bug Report
description: Sadhna app में कोई bug मिला?
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g. v1.2.0
    validations:
      required: true

  - type: dropdown
    id: android
    attributes:
      label: Android Version
      options: ["Android 9","Android 10","Android 11","Android 12","Android 13","Android 14","Android 15"]
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug क्या है?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["🔴 Critical (crash)","🟠 High (feature broken)","🟡 Medium","🟢 Low"]
    validations:
      required: true
